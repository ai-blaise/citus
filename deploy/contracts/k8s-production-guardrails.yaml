      app.kubernetes.io/component: "pool"
  minAvailable: 2
---
apiVersion: "autoscaling/v2"
kind: "HorizontalPodAutoscaler"
metadata:
  name: "ai-blaise-citus-pool"
  labels:
    app.kubernetes.io/name: "ai-blaise-citus"
    app.kubernetes.io/component: "pool"
    app.kubernetes.io/managed-by: "ai-blaise-citus-contract"
    ai-blaise.com/deployment-contract: "k8s-production-guardrails"
    ai-blaise.com/guardrail: "hpa"
  annotations:
    ai-blaise.com/chart: "command-center/citus-cluster"
    ai-blaise.com/chart-fold-date: "2026-05-22"
spec:
  scaleTargetRef:
    apiVersion: "apps/v1"
    kind: "Deployment"
    name: "ai-blaise-citus-pool"
  minReplicas: 3
  maxReplicas: 12
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 300
      policies:
        -
          type: "Percent"
          value: 50
          periodSeconds: 60
    scaleUp:
      stabilizationWindowSeconds: 0
      policies:
        -
          type: "Percent"
          value: 100
          periodSeconds: 30
        -
          type: "Pods"
          value: 2
          periodSeconds: 30
      selectPolicy: "Max"
  metrics:
    -
      type: "Resource"
      resource:
        name: "cpu"
        target:
          type: "Utilization"
          averageUtilization: 70
    -
      type: "Resource"
      resource:
        name: "memory"
        target:
          type: "Utilization"
          averageUtilization: 80
---
apiVersion: "networking.k8s.io/v1"
kind: "NetworkPolicy"
metadata:
  name: "ai-blaise-citus-operator"
  labels:
    app.kubernetes.io/name: "ai-blaise-citus"
    app.kubernetes.io/component: "operator"
    app.kubernetes.io/managed-by: "ai-blaise-citus-contract"
    ai-blaise.com/deployment-contract: "k8s-production-guardrails"
    ai-blaise.com/guardrail: "network-policy"
  annotations:
    ai-blaise.com/chart: "command-center/citus-cluster"
    ai-blaise.com/chart-fold-date: "2026-05-22"
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: "ai-blaise-citus"
      app.kubernetes.io/component: "operator"
  policyTypes:
    - "Ingress"
  ingress:
    -
      from:
        -
          namespaceSelector: {}
          podSelector:
            matchLabels:
              app.kubernetes.io/name: "prometheus"
      ports:
        -
          protocol: "TCP"
          port: 8080
---
apiVersion: "networking.k8s.io/v1"
kind: "NetworkPolicy"
metadata:
  name: "ai-blaise-citus-pool-postgres"
  labels:
    app.kubernetes.io/name: "ai-blaise-citus"
    app.kubernetes.io/component: "pool"
    app.kubernetes.io/managed-by: "ai-blaise-citus-contract"
    ai-blaise.com/deployment-contract: "k8s-production-guardrails"
    ai-blaise.com/guardrail: "network-policy"
  annotations:
    ai-blaise.com/chart: "command-center/citus-cluster"
    ai-blaise.com/chart-fold-date: "2026-05-22"
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: "ai-blaise-citus"
      app.kubernetes.io/component: "pool"
  policyTypes:
    - "Ingress"
  ingress:
    -
      from:
        -
          podSelector:
            matchLabels:
              app.kubernetes.io/name: "ai-blaise-citus"
              app.kubernetes.io/component: "operator"
        -
          namespaceSelector: {}
          podSelector:
            matchLabels:
              app.kubernetes.io/name: "prometheus"
      ports:
        -
          protocol: "TCP"
          port: 8080
    -
      from:
        -
          namespaceSelector:
            matchLabels:
              ai-blaise.com/pool-client: "true"
        -
          ipBlock:
            cidr: "10.0.0.0/8"
        -
          ipBlock:
            cidr: "172.16.0.0/12"
        -
          ipBlock:
            cidr: "192.168.0.0/16"
      ports:
        -
          protocol: "TCP"
          port: 5432
