global:
  imageRegistry: ghcr.io/ai-blaise
  imagePullPolicy: IfNotPresent
  requireImageDigest: true

operator:
  replicas: 2
  controllerRbac:
    enabled: false
  image:
    repository: citus-operator
    tag: "0.1.0"
    digest: ""
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 512Mi
  serviceMonitor:
    enabled: true

pool:
  replicas: 3
  image:
    repository: citus-pool
    tag: "0.1.0"
    digest: ""
  service:
    port: 5432
    adminPort: 8080
  upstream:
    host: ai-blaise-citus-postgres-rw
    port: 5432
  resources:
    requests:
      cpu: 250m
      memory: 256Mi
    limits:
      cpu: "1"
      memory: 1Gi
  protocolPipeline:
    enabled: false
    maxInFlight: 64
  networkPolicy:
    cidrAllowlist: []

postgres:
  ioMethod: ""

sidecarDefaults:
  tag: "0.1.0"
  digest: ""
  port: 8080
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 512Mi

sidecars:
  - name: analytical
    enabled: false
    replicas: 2
  - name: auth
    enabled: false
    replicas: 2
  - name: backup
    enabled: false
    replicas: 2
  - name: cdc
    enabled: false
    replicas: 2
  - name: coldtier
    enabled: false
    replicas: 2
  - name: edge-functions
    enabled: false
    replicas: 2
  - name: graphql
    enabled: false
    replicas: 2
  - name: hlc
    enabled: false
    replicas: 2
  - name: mcp
    enabled: false
    replicas: 2
  - name: postgrest
    enabled: false
    replicas: 2
  - name: raft
    enabled: false
    replicas: 3
  - name: realtime
    enabled: false
    replicas: 2
  - name: repack
    enabled: false
    replicas: 2
  - name: schema-job
    enabled: false
    replicas: 2
  - name: storage
    enabled: false
    replicas: 2
  - name: txn-status
    enabled: false
    replicas: 2
  - name: vectorizer
    enabled: false
    replicas: 2

observability:
  grafanaDashboards:
    enabled: true
    folder: ai-blaise-citus
  alertRules:
    enabled: true
    interval: 30s
    thresholds:
      replicationLagSeconds: 60
      vectorizerBacklog: 1000
      poolErrorRatePercent: 5

security:
  externalSecrets:
    enabled: false
    secretStoreRef: ""
  tls:
    clients: false
    postgres: false
    sidecars: false
  releaseAttestation:
    sbom: false
    cosign: false

tools:
  enabled: false
  image:
    repository: citusctl
    tag: "0.1.0"
    digest: ""
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 250m
      memory: 256Mi
