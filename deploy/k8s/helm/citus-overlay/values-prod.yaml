global:
  requireImageDigest: true

operator:
  replicas: 2
  serviceMonitor:
    enabled: true

pool:
  replicas: 3
  upstream:
    host: ai-blaise-citus-postgres-rw
    port: 5432
  protocolPipeline:
    enabled: false
    maxInFlight: 64
  networkPolicy:
    cidrAllowlist: []

postgres:
  ioMethod: ""

sidecars:
  - name: analytical
    enabled: false
    replicas: 2
  - name: auth
    enabled: false
    replicas: 2
  - name: backup
    enabled: false
    replicas: 2
  - name: cdc
    enabled: false
    replicas: 2
  - name: coldtier
    enabled: false
    replicas: 2
  - name: edge-functions
    enabled: false
    replicas: 2
  - name: graphql
    enabled: false
    replicas: 2
  - name: hlc
    enabled: false
    replicas: 2
  - name: mcp
    enabled: false
    replicas: 2
  - name: postgrest
    enabled: false
    replicas: 2
  - name: raft
    enabled: false
    replicas: 3
  - name: realtime
    enabled: false
    replicas: 2
  - name: repack
    enabled: false
    replicas: 2
  - name: schema-job
    enabled: false
    replicas: 2
  - name: storage
    enabled: false
    replicas: 2
  - name: txn-status
    enabled: false
    replicas: 2
  - name: vectorizer
    enabled: false
    replicas: 2

tools:
  enabled: false

observability:
  grafanaDashboards:
    enabled: true
  alertRules:
    enabled: true

security:
  externalSecrets:
    enabled: false
    secretStoreRef: ""
  tls:
    clients: false
    postgres: false
    sidecars: false
  releaseAttestation:
    sbom: false
    cosign: false
