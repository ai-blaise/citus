global:
  imageRegistry: ghcr.io/ai-blaise
  imagePullPolicy: IfNotPresent
  requireImageDigest: false

operator:
  replicas: 1
  image:
    repository: citus-operator
    tag: "0.1.0"
    digest: ""
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 512Mi
  serviceMonitor:
    enabled: false

pool:
  replicas: 2
  image:
    repository: citus-pool
    tag: "0.1.0"
    digest: ""
  service:
    port: 5432
    adminPort: 8080
  upstream:
    host: ai-blaise-citus-postgres-rw
    port: 5432
  resources:
    requests:
      cpu: 250m
      memory: 256Mi
    limits:
      cpu: "1"
      memory: 1Gi
  protocolPipeline:
    enabled: true
    maxInFlight: 32
  networkPolicy:
    cidrAllowlist:
      - 10.0.0.0/8

postgres:
  ioMethod: io_uring

sidecarDefaults:
  tag: "0.1.0"
  digest: ""
  port: 8080
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 512Mi

sidecars:
  - name: analytical
    enabled: true
    replicas: 1
  - name: auth
    enabled: true
    replicas: 1
  - name: backup
    enabled: true
    replicas: 1
  - name: cdc
    enabled: true
    replicas: 1
  - name: coldtier
    enabled: true
    replicas: 1
  - name: edge-functions
    enabled: true
    replicas: 1
  - name: graphql
    enabled: true
    replicas: 1
  - name: hlc
    enabled: true
    replicas: 1
  - name: mcp
    enabled: true
    replicas: 1
  - name: postgrest
    enabled: true
    replicas: 1
  - name: raft
    enabled: true
    replicas: 1
  - name: realtime
    enabled: true
    replicas: 1
  - name: repack
    enabled: true
    replicas: 1
  - name: schema-job
    enabled: true
    replicas: 1
  - name: storage
    enabled: true
    replicas: 1
  - name: txn-status
    enabled: true
    replicas: 1
  - name: vectorizer
    enabled: true
    replicas: 1

observability:
  grafanaDashboards:
    enabled: true
    folder: ai-blaise-citus
  alertRules:
    enabled: false
    interval: 30s
    thresholds:
      replicationLagSeconds: 60
      vectorizerBacklog: 1000
      poolErrorRatePercent: 5

security:
  externalSecrets:
    enabled: true
    secretStoreRef: ai-blaise-cluster-secrets
  tls:
    clients: true
    postgres: true
    sidecars: true
  releaseAttestation:
    sbom: true
    cosign: true

tools:
  enabled: false
  image:
    repository: citusctl
    tag: "0.1.0"
    digest: ""
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 250m
      memory: 256Mi
