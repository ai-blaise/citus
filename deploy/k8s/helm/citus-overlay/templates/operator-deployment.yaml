apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "citus-overlay.name" . }}-operator
  labels:
    {{- include "citus-overlay.labels" . | nindent 4 }}
    app.kubernetes.io/component: operator
spec:
  replicas: {{ .Values.operator.replicas }}
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ include "citus-overlay.name" . }}
      app.kubernetes.io/component: operator
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ include "citus-overlay.name" . }}
        app.kubernetes.io/component: operator
    spec:
      serviceAccountName: {{ include "citus-overlay.name" . }}-operator
      containers:
        - name: operator
          image: {{ include "citus-overlay.image" (dict "Values" .Values "repository" .Values.operator.image.repository "tag" .Values.operator.image.tag) }}
          imagePullPolicy: {{ .Values.global.imagePullPolicy }}
          ports:
            - name: metrics
              containerPort: 8080
          resources:
            {{- toYaml .Values.operator.resources | nindent 12 }}
