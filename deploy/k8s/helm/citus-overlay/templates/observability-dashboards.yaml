# FEATURE: O6
{{- if .Values.observability.grafanaDashboards.enabled }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "citus-overlay.name" . }}-dashboards
  labels:
    {{- include "citus-overlay.labels" . | nindent 4 }}
    app.kubernetes.io/component: observability
    grafana_dashboard: "1"
  annotations:
    ai-blaise.com/grafana-folder: {{ .Values.observability.grafanaDashboards.folder | quote }}
data:
  ai-blaise-citus-overview.json: |-
    {
      "title": "ai-blaise Citus Overview",
      "schemaVersion": 39,
      "tags": ["ai-blaise", "citus"],
      "timezone": "browser",
      "panels": [
        {
          "title": "Coordinator query latency p95",
          "type": "timeseries",
          "targets": [
            {
              "expr": "histogram_quantile(0.95, sum(rate(ai_blaise_citus_query_duration_seconds_bucket[5m])) by (le, query_class))"
            }
          ]
        },
        {
          "title": "Distributed replication lag",
          "type": "timeseries",
          "targets": [
            {
              "expr": "max(ai_blaise_citus_replication_lag_seconds) by (region)"
            }
          ]
        },
        {
          "title": "Vectorizer backlog",
          "type": "timeseries",
          "targets": [
            {
              "expr": "sum(ai_blaise_citus_vectorizer_backlog_jobs) by (tenant)"
            }
          ]
        }
      ]
    }
  ai-blaise-citus-sidecars.json: |-
    {
      "title": "ai-blaise Citus Sidecars",
      "schemaVersion": 39,
      "tags": ["ai-blaise", "citus", "sidecars"],
      "timezone": "browser",
      "panels": [
        {
          "title": "Sidecar readiness",
          "type": "stat",
          "targets": [
            {
              "expr": "min(ai_blaise_sidecar_ready) by (component)"
            }
          ]
        },
        {
          "title": "Pool error rate percent",
          "type": "timeseries",
          "targets": [
            {
              "expr": "100 * sum(rate(ai_blaise_citus_pool_errors_total[5m])) / clamp_min(sum(rate(ai_blaise_citus_pool_requests_total[5m])), 0.001)"
            }
          ]
        }
      ]
    }
{{- end }}
