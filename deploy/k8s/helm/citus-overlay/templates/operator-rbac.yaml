apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "citus-overlay.name" . }}-operator
  labels:
    {{- include "citus-overlay.labels" . | nindent 4 }}
{{- if .Values.operator.controllerRbac.enabled }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "citus-overlay.name" . }}-operator
rules:
  - apiGroups: ["ai-blaise.com"]
    resources:
      - backups
      - branches
      - citusclusters
      - conflictpolicies
      - federations
      - functions
      - hypertables
      - migrations
      - regions
      - scheduledrepacks
      - searchindexes
      - shardgroups
      - sidecars
      - survivalgoals
      - tenants
      - vectorizers
      - webhooks
    verbs: ["get", "list", "watch", "update", "patch"]
  - apiGroups: ["ai-blaise.com"]
    resources:
      - citusclusters/status
      - shardgroups/status
    verbs: ["get", "update", "patch"]
  - apiGroups: [""]
    resources: ["configmaps", "events", "services"]
    verbs: ["get", "list", "watch", "create", "update", "patch"]
  - apiGroups: ["apps"]
    resources: ["deployments"]
    verbs: ["get", "list", "watch", "create", "update", "patch"]
  - apiGroups: ["postgresql.cnpg.io"]
    resources: ["clusters"]
    verbs: ["get", "list", "watch", "create", "update", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "citus-overlay.name" . }}-operator
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ include "citus-overlay.name" . }}-operator
subjects:
  - kind: ServiceAccount
    name: {{ include "citus-overlay.name" . }}-operator
    namespace: {{ .Release.Namespace }}
{{- end }}
