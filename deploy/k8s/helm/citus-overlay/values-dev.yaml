global:
  requireImageDigest: false

operator:
  replicas: 1
  controllerRbac:
    enabled: false

pool:
  replicas: 1
  upstream:
    host: ai-blaise-citus-postgres-rw
    port: 5432
  networkPolicy:
    cidrAllowlist:
      - 10.0.0.0/8

postgres:
  postgresMajor: 18
  ioMethod: io_uring

sidecars:
  - name: analytical
    enabled: false
    replicas: 1
  - name: auth
    enabled: false
    replicas: 1
  - name: backup
    enabled: false
    replicas: 1
  - name: cdc
    enabled: false
    replicas: 1
  - name: coldtier
    enabled: false
    replicas: 1
  - name: edge-functions
    enabled: false
    replicas: 1
  - name: graphql
    enabled: false
    replicas: 1
  - name: hlc
    enabled: false
    replicas: 1
  - name: mcp
    enabled: true
    replicas: 1
  - name: postgrest
    enabled: false
    replicas: 1
  - name: raft
    enabled: false
    replicas: 1
  - name: realtime
    enabled: false
    replicas: 1
  - name: repack
    enabled: false
    replicas: 1
  - name: schema-job
    enabled: true
    replicas: 1
  - name: storage
    enabled: false
    replicas: 1
  - name: txn-status
    enabled: false
    replicas: 1
  - name: vectorizer
    enabled: true
    replicas: 1

tools:
  enabled: true

observability:
  grafanaDashboards:
    enabled: true
  alertRules:
    enabled: false

security:
  externalSecrets:
    enabled: false
  tls:
    clients: false
    postgres: false
    sidecars: false
  releaseAttestation:
    sbom: true
    cosign: false
