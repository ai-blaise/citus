name: coverage
inputs:
  flags:
    required: false
  codecov_token:
    required: false
runs:
  using: composite
  steps:
  - uses: codecov/codecov-action@v5
    if: ${{ inputs.codecov_token != '' }}
    with:
      flags: ${{ inputs.flags }}
      token: ${{ inputs.codecov_token }}
      verbose: true
      gcov: true
  - name: Skip Codecov upload without token
    if: ${{ inputs.codecov_token == '' }}
    shell: bash
    run: echo "Skipping Codecov upload because no token was provided."
