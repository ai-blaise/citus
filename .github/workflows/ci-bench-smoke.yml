name: bench-smoke

on:
  pull_request:
  push:
    branches:
      - main
      - ai-blaise/dev

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Run benchmark smoke (quick mode)
        run: bash ci/ai-blaise/benchmark-smoke.sh
