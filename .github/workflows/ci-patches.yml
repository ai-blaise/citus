name: patches

on:
  pull_request:
  push:
    branches:
      - main
      - ai-blaise/dev
      - bootstrap-v2

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify quilt patches apply cleanly
        run: make -f Makefile.ai-blaise patches-check
      - name: Verify router patch smoke
        run: make -f Makefile.ai-blaise router-patch-smoke
      - name: Audit Citus patch production gates
        run: make -f Makefile.ai-blaise citus-patch-production-audit
