name: license

on:
  pull_request:
  push:
    branches:
      - main
      - ai-blaise/dev
      - bootstrap-v2

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions-rust-lang/setup-rust-toolchain@v1
      - name: Test license audit failure boundaries
        run: python3 ci/ai-blaise/license-check_test.py
      - name: Check license audit against locked metadata
        env:
          AI_BLAISE_RELEASE_MODE: "1"
        run: bash ci/ai-blaise/license-check.sh
