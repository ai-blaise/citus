name: production-readiness

on:
  pull_request:
  push:
    branches:
      - main
      - ai-blaise/dev
      - bootstrap-v2

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  extension-security-backup:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - major: 17
          - major: 18
    steps:
      - uses: actions/checkout@v5
      - name: Prove privilege-preserving upgrade and populated logical restore
        env:
          EXTENSION_SECURITY_PG_MAJOR: ${{ matrix.major }}
        run: bash ci/ai-blaise/extension-security-backup-smoke.sh

  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Check Kubernetes deployment guardrail contract
        run: bash ci/ai-blaise/deploy-check.sh
      - name: Check production-readiness audit guardrails
        run: bash ci/ai-blaise/production-readiness-check.sh
      - name: Check docs evidence boundaries
        run: bash ci/ai-blaise/docs-evidence-boundary-check.sh
      - name: Check production gap guardrails
        run: bash ci/ai-blaise/production-gap-audit.sh
      - uses: actions-rust-lang/setup-rust-toolchain@v1
      - name: Cargo audit (warnings denied; reviewed policy enforced)
        run: |
          cargo install cargo-audit --locked --version 0.22.2
          bash ci/ai-blaise/cargo-audit-policy-smoke.sh
      - name: Run release gate monitor static contract
        run: RELEASE_GATE_MONITOR_STATIC=1 bash ci/ai-blaise/release-gate-monitor.sh --local-only
      - name: Check runbook command examples
        run: bash ci/ai-blaise/runbook-command-check.sh
      - name: Check release hardening runbook
        run: bash ci/ai-blaise/release-hardening-runbook-smoke.sh
      - name: Run canary upgrade rollback smoke
        env:
          REQUIRE_DOCKER: "1"
        run: bash ci/ai-blaise/canary-upgrade-rollback-smoke.sh
