name: companion

on:
  pull_request:
  push:
    branches:
      - main
      - ai-blaise/dev

jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Format
        run: cargo fmt --all -- --check
      - name: Check tests
        run: cargo check -p ai_blaise_citus_companion --all-targets
      - name: Test
        run: cargo test -p ai_blaise_citus_companion
      - name: Run canonical advanced planner contract report
        run: cargo run -q -p ai_blaise_citus_companion --bin companion_contracts -- run-advanced-planner-canonical
      - name: Run companion advanced planner smoke
        run: bash ci/ai-blaise/companion-advanced-planner-smoke.sh
      - name: Run FDW credential rotation live smoke
        run: REQUIRE_DOCKER=1 bash ci/ai-blaise/fdw-credential-rotation-live-smoke.sh
      - name: Run canonical extension catalog report
        run: cargo run -q -p ai_blaise_citus_companion --bin companion_contracts -- run-extension-catalog-canonical
      - name: Run canonical cohabit detection report
        run: cargo run -q -p ai_blaise_citus_companion --bin companion_contracts -- run-cohabit-detection-canonical
      - name: Run cohabit detection smoke
        run: bash ci/ai-blaise/cohabit-detection-smoke.sh
      - name: Run canonical domain contract report
        run: cargo run -q -p ai_blaise_citus_companion --bin companion_contracts -- run-domain-contracts-canonical
      - name: Run canonical operations readiness report
        run: cargo run -q -p ai_blaise_citus_companion --bin companion_contracts -- run-operations-canonical
      - name: Run companion runtime depth A smoke
        run: bash ci/ai-blaise/companion-runtime-depth-a-smoke.sh
