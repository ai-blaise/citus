name: companion

on:
  pull_request:
  push:
    branches:
      - main
      - ai-blaise/dev
      - bootstrap-v2

permissions:
  contents: read

jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          components: clippy, rustfmt
      - name: Format
        run: cargo fmt --all -- --check
      - name: Clippy ai_blaise_citus_companion (warnings denied)
        run: cargo clippy -p ai_blaise_citus_companion --all-targets -- -D warnings
      - name: Rustdoc broken-intra-doc-links ai_blaise_citus_companion
        run: RUSTDOCFLAGS="-D rustdoc::broken-intra-doc-links" cargo doc -p ai_blaise_citus_companion --no-deps
      - name: Check tests
        run: cargo check -p ai_blaise_citus_companion --all-targets
      - name: Test
        run: cargo test -p ai_blaise_citus_companion
      - name: Run canonical advanced planner contract report
        run: cargo run -q -p ai_blaise_citus_companion --bin companion_contracts -- run-advanced-planner-canonical
      - name: Run companion advanced planner smoke
        run: bash ci/ai-blaise/companion-advanced-planner-smoke.sh
      - name: Run Edge2 libsql research guard smoke
        run: bash ci/ai-blaise/edge2-libsql-research-guard-smoke.sh
      - name: Run canonical columnar tiering report
        run: cargo run -q -p ai_blaise_citus_companion --bin companion_contracts -- run-columnar-tiering-canonical
      - name: Run canonical columnar tiering SQL
        run: cargo run -q -p ai_blaise_citus_companion --bin companion_contracts -- run-columnar-tiering-sql-canonical
      - name: Run canonical cross-tier query report
        run: cargo run -q -p ai_blaise_citus_companion --bin companion_contracts -- run-cross-tier-query-canonical
      - name: Run canonical cross-tier query SQL
        run: cargo run -q -p ai_blaise_citus_companion --bin companion_contracts -- run-cross-tier-query-sql-canonical
      - name: Run canonical regional placement report
        run: cargo run -q -p ai_blaise_citus_companion --bin companion_contracts -- run-regional-placement-canonical
      - name: Run canonical regional placement SQL
        run: cargo run -q -p ai_blaise_citus_companion --bin companion_contracts -- run-regional-placement-sql-canonical
      - name: Run canonical transaction state report
        run: cargo run -q -p ai_blaise_citus_companion --bin companion_contracts -- run-transaction-state-canonical
      - name: Run canonical transaction state SQL
        run: cargo run -q -p ai_blaise_citus_companion --bin companion_contracts -- run-transaction-state-sql-canonical
      - name: Run canonical shard temperature ranking report
        run: cargo run -q -p ai_blaise_citus_companion --bin companion_contracts -- run-shard-temperature-ranking-canonical
      - name: Run canonical shard temperature ranking SQL
        run: cargo run -q -p ai_blaise_citus_companion --bin companion_contracts -- run-shard-temperature-ranking-sql-canonical
      - name: Run FDW credential rotation live smoke
        run: REQUIRE_DOCKER=1 bash ci/ai-blaise/fdw-credential-rotation-live-smoke.sh
      - name: Run schema drift live smoke
        run: REQUIRE_DOCKER=1 bash ci/ai-blaise/schema-drift-live-smoke.sh
      - name: Run canonical extension catalog report
        run: cargo run -q -p ai_blaise_citus_companion --bin companion_contracts -- run-extension-catalog-canonical
      - name: Run canonical cohabit detection report
        run: cargo run -q -p ai_blaise_citus_companion --bin companion_contracts -- run-cohabit-detection-canonical
      - name: Run cohabit detection smoke
        run: bash ci/ai-blaise/cohabit-detection-smoke.sh
      - name: Run canonical domain contract report
        run: cargo run -q -p ai_blaise_citus_companion --bin companion_contracts -- run-domain-contracts-canonical
      - name: Run canonical operations readiness report
        run: cargo run -q -p ai_blaise_citus_companion --bin companion_contracts -- run-operations-canonical
      - name: Run companion runtime depth A smoke
        run: bash ci/ai-blaise/companion-runtime-depth-a-smoke.sh
