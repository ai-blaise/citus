name: deploy

on:
  pull_request:
  push:
    branches:
      - main
      - ai-blaise/dev
      - ai-blaise/bootstrap-v2

jobs:
  chart-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check deploy chart contract
        run: bash ci/ai-blaise/deploy-check.sh
