name: release-gate-monitor

on:
  pull_request:
  push:
    branches:
      - main
      - ai-blaise/dev
      - bootstrap-v2

permissions:
  contents: read

jobs:
  monitor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          components: clippy, rustfmt
      - name: Install benchmark format tooling
        run: python -m pip install black==24.10.0
      - name: Run release gate monitor
        run: REQUIRE_BLACK=1 bash ci/ai-blaise/release-gate-monitor.sh --local-only
