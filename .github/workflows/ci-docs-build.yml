name: docs-build

on:
  pull_request:
    paths:
      - "docs/**"
      - "mkdocs.yml"
      - ".github/workflows/ci-docs-build.yml"
  push:
    branches:
      - main
      - ai-blaise/dev
    paths:
      - "docs/**"
      - "mkdocs.yml"
      - ".github/workflows/ci-docs-build.yml"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install mkdocs-material
        run: |
          python -m pip install --upgrade pip
          pip install mkdocs-material==9.5.39 mike==2.1.3
      - name: Build site with --strict (rejects warnings)
        run: mkdocs build --strict
      - name: Upload site artifact
        uses: actions/upload-artifact@v4
        with:
          name: mkdocs-site
          path: site/
          retention-days: 7
