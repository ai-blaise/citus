name: e2e-model

on:
  pull_request:
  push:
    branches:
      - main
      - ai-blaise/dev
      - bootstrap-v2

permissions:
  contents: read

jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          components: clippy, rustfmt
      - name: Format
        run: cargo fmt --all -- --check
      - name: Clippy ai_blaise_citus_e2e (warnings denied)
        run: cargo clippy -p ai_blaise_citus_e2e --all-targets -- -D warnings
      - name: Rustdoc broken-intra-doc-links ai_blaise_citus_e2e
        run: RUSTDOCFLAGS="-D rustdoc::broken-intra-doc-links" cargo doc -p ai_blaise_citus_e2e --no-deps
      - name: Check all targets
        run: cargo check -p ai_blaise_citus_e2e --all-targets
      - name: Test
        run: cargo test -p ai_blaise_citus_e2e
