name: e2e-model

on:
  pull_request:
  push:
    branches:
      - main
      - ai-blaise/dev

jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Format
        run: cargo fmt --all -- --check
      - name: Check tests
        run: cargo check -p ai_blaise_citus_e2e --tests
      - name: Test
        run: cargo test -p ai_blaise_citus_e2e
