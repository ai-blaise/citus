name: slop-scan

on:
  pull_request:
  push:
    branches:
      - main
      - ai-blaise/dev
      - bootstrap-v2

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Scan ai-blaise overlay text
        run: make -f Makefile.ai-blaise slop-scan
