name: observability-contracts

on:
  pull_request:
  push:
    branches:
      - main
      - ai-blaise/dev
      - bootstrap-v2

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions-rust-lang/setup-rust-toolchain@v1
      - name: Install PostgreSQL client
        run: sudo apt-get update && sudo apt-get install -y postgresql-client
      - name: Smoke custom component observability contracts
        run: bash ci/ai-blaise/observability-contracts-check.sh
      - name: Smoke trace propagation
        env:
          REQUIRE_DOCKER: "1"
        run: bash ci/ai-blaise/otel-trace-propagation-smoke.sh
      - name: Smoke structured-log ingestion through PostgreSQL views
        run: bash ci/ai-blaise/structured-log-ingestion-smoke.sh
