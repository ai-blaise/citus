name: operator

on:
  pull_request:
  push:
    branches:
      - main
      - ai-blaise/dev
      - bootstrap-v2

jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - name: Format
        run: cargo fmt --all -- --check
      - name: Clippy ai_blaise_citus_operator (warnings denied)
        run: cargo clippy -p ai_blaise_citus_operator --all-targets -- -D warnings
      - name: Rustdoc broken-intra-doc-links ai_blaise_citus_operator
        run: RUSTDOCFLAGS="-D rustdoc::broken-intra-doc-links" cargo doc -p ai_blaise_citus_operator --no-deps
      - name: Check all targets
        run: cargo check -p ai_blaise_citus_operator --all-targets
      - name: Test
        run: cargo test -p ai_blaise_citus_operator
      - name: Run canonical operator contract
        run: cargo run -q -p ai_blaise_citus_operator -- run-canonical
      - name: Run Batch C reconciler contract
        run: bash ci/ai-blaise/operator-reconcilers-batch-c-smoke.sh
      - name: Run branch lifecycle smoke
        run: bash ci/ai-blaise/operator-branch-lifecycle-smoke.sh
      - name: Run controller boundary smoke
        run: bash ci/ai-blaise/operator-boundary-smoke.sh
      - name: Run EndpointSlice retarget smoke
        run: bash ci/ai-blaise/endpointslice-retarget-smoke.sh
      - name: Run operator security enforcement smoke
        run: bash ci/ai-blaise/security-enforcement-smoke.sh
      - name: Run security supply-chain smoke
        run: bash ci/ai-blaise/security-supply-chain-smoke.sh
