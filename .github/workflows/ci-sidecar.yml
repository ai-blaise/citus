name: sidecar

on:
  pull_request:
  push:
    branches:
      - main
      - ai-blaise/dev

jobs:
  analytical:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Format
        run: cargo fmt --all -- --check
      - name: Check tests
        run: cargo check -p ai_blaise_citus_sidecar_analytical --all-targets
      - name: Test
        run: cargo test -p ai_blaise_citus_sidecar_analytical
      - name: Run canonical analytical report
        run: cargo run -q -p ai_blaise_citus_sidecar_analytical -- run-canonical
      - name: Run canonical analytical runtime
        run: cargo run -q -p ai_blaise_citus_sidecar_analytical -- run-runtime-canonical

  shared:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Format
        run: cargo fmt --all -- --check
      - name: Check tests
        run: cargo check -p ai_blaise_citus_sidecar_shared --all-targets
      - name: Test
        run: cargo test -p ai_blaise_citus_sidecar_shared
      - name: Run HA retarget canonical report
        run: cargo run -q -p ai_blaise_citus_sidecar_shared -- ha-canonical

  vectorizer:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Format
        run: cargo fmt --all -- --check
      - name: Check tests
        run: cargo check -p ai_blaise_citus_sidecar_vectorizer --all-targets
      - name: Test
        run: cargo test -p ai_blaise_citus_sidecar_vectorizer
      - name: Run canonical vectorizer report
        run: cargo run -q -p ai_blaise_citus_sidecar_vectorizer -- run-canonical
      - name: Run Postgres-backed vectorizer smoke
        run: REQUIRE_DOCKER=1 bash ci/ai-blaise/sidecar-vectorizer-smoke.sh

  auth:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Format
        run: cargo fmt --all -- --check
      - name: Check tests
        run: cargo check -p ai_blaise_citus_sidecar_auth --all-targets
      - name: Test
        run: cargo test -p ai_blaise_citus_sidecar_auth
      - name: Auth HTTP smoke
        env:
          REQUIRE_DOCKER: "1"
        run: bash ci/ai-blaise/auth-sidecar-smoke.sh

  backup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Format
        run: cargo fmt --all -- --check
      - name: Check tests
        run: cargo check -p ai_blaise_citus_sidecar_backup --all-targets
      - name: Test
        run: cargo test -p ai_blaise_citus_sidecar_backup
      - name: Run canonical backup report
        run: cargo run -q -p ai_blaise_citus_sidecar_backup -- run-canonical
      - name: Run canonical backup runtime
        run: cargo run -q -p ai_blaise_citus_sidecar_backup -- run-runtime-canonical
      - name: Run backup HTTP smoke
        run: bash ci/ai-blaise/sidecar-backup-smoke.sh

  cdc:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Format
        run: cargo fmt --all -- --check
      - name: Check tests
        run: cargo check -p ai_blaise_citus_sidecar_cdc --all-targets
      - name: Test
        run: cargo test -p ai_blaise_citus_sidecar_cdc
      - name: Run canonical CDC delivery
        run: cargo run -q -p ai_blaise_citus_sidecar_cdc -- run-canonical
      - name: Run canonical CDC runtime
        run: cargo run -q -p ai_blaise_citus_sidecar_cdc -- run-runtime-canonical
      - name: Run CDC runtime smoke
        run: bash ci/ai-blaise/sidecar-cdc-smoke.sh

  coldtier:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Format
        run: cargo fmt --all -- --check
      - name: Check tests
        run: cargo check -p ai_blaise_citus_sidecar_coldtier --all-targets
      - name: Test
        run: cargo test -p ai_blaise_citus_sidecar_coldtier
      - name: Run canonical cold-tier report
        run: cargo run -q -p ai_blaise_citus_sidecar_coldtier -- run-canonical
      - name: Run canonical cold-tier runtime
        run: cargo run -q -p ai_blaise_citus_sidecar_coldtier -- run-runtime-canonical

  edge-functions:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Format
        run: cargo fmt --all -- --check
      - name: Check tests
        run: cargo check -p ai_blaise_citus_sidecar_edge_functions --all-targets
      - name: Test
        run: cargo test -p ai_blaise_citus_sidecar_edge_functions
      - name: Run canonical edge-function report
        run: cargo run -q -p ai_blaise_citus_sidecar_edge_functions -- run-canonical
      - name: Run canonical edge-function runtime
        run: cargo run -q -p ai_blaise_citus_sidecar_edge_functions -- run-runtime-canonical
      - name: Run canonical edge-function registry
        run: cargo run -q -p ai_blaise_citus_sidecar_edge_functions -- run-registry-canonical

  api-runtime-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Run API sidecar runtime smoke
        run: bash ci/ai-blaise/sidecar-api-runtime-smoke.sh

  graphql:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Format
        run: cargo fmt --all -- --check
      - name: Check tests
