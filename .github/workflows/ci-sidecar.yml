      - name: Test
        run: cargo test -p ai_blaise_citus_sidecar_graphql
      - name: Run canonical GraphQL runtime
        run: cargo run -q -p ai_blaise_citus_sidecar_graphql -- run-runtime-canonical

  hlc:
