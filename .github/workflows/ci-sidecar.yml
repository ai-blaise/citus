name: sidecar

on:
  pull_request:
  push:
    branches:
      - main
      - ai-blaise/dev

jobs:
  shared:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Format
        run: cargo fmt --all -- --check
      - name: Check tests
        run: cargo check -p ai_blaise_citus_sidecar_shared --tests
      - name: Test
        run: cargo test -p ai_blaise_citus_sidecar_shared
