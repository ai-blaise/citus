name: v2-inventory-identity

on:
  pull_request:
  push:
    branches:
      - main
      - ai-blaise/dev
      - bootstrap-v2

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions-rust-lang/setup-rust-toolchain@v1
      - name: Test the machine feature register
        run: cargo test --locked -p ai_blaise_feature_register
      - name: Build the real feature-register validator
        run: cargo build --locked --quiet -p ai_blaise_feature_register
      - name: Test the inventory-only compatibility gate
        run: |
          python3 ci/ai-blaise/v2-closure-check_test.py \
            --feature-register-bin "${GITHUB_WORKSPACE}/target/debug/ai_blaise_feature_register"
      - name: Check feature inventory structure and identity
        run: |
          bash ci/ai-blaise/v2-closure-check.sh \
            --feature-register-bin "${GITHUB_WORKSPACE}/target/debug/ai_blaise_feature_register"
