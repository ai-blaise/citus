name: upstream-sync

on:
  workflow_dispatch:
  schedule:
    - cron: "17 6 */14 * *"

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  dry-run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify patches against upstream release branch
        run: bash ci/ai-blaise/upstream-merge-dry.sh
