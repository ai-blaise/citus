name: tools

on:
  pull_request:
  push:
    branches:
      - main
      - ai-blaise/dev

jobs:
  mcp:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Format
        run: cargo fmt --all -- --check
      - name: Check tests
        run: cargo check -p ai_blaise_citus_mcp --all-targets
      - name: Test
        run: cargo test -p ai_blaise_citus_mcp
      - name: Run canonical MCP tool report
        run: cargo run -q -p ai_blaise_citus_mcp -- run-canonical
      - name: Run MCP stdio smoke
        run: bash ci/ai-blaise/mcp-stdio-smoke.sh

  citusctl:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Format
        run: cargo fmt --all -- --check
      - name: Check tests
        run: cargo check -p ai_blaise_citusctl --tests
      - name: Test
        run: cargo test -p ai_blaise_citusctl
      - name: Run canonical citusctl report
        run: cargo run -q -p ai_blaise_citusctl -- run-canonical
      - name: Run citusctl plan-id smoke
        run: bash ci/ai-blaise/citusctl-smoke.sh

  lsp:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Format
        run: cargo fmt --all -- --check
      - name: Check tests
        run: cargo check -p ai_blaise_citus_lsp --all-targets
      - name: Test
        run: cargo test -p ai_blaise_citus_lsp
      - name: Run file-backed LSP smoke
        run: bash ci/ai-blaise/citus-lsp-smoke.sh

  watch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Format
        run: cargo fmt --all -- --check
      - name: Check tests
        run: cargo check -p ai_blaise_citus_watch --all-targets
      - name: Test
        run: cargo test -p ai_blaise_citus_watch
      - name: Run canonical watch dashboard report
        run: cargo run -q -p ai_blaise_citus_watch -- run-canonical

  schema-designer:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Format
        run: cargo fmt --all -- --check
      - name: Check tests
        run: cargo check -p ai_blaise_citus_schema_designer --all-targets
      - name: Test
        run: cargo test -p ai_blaise_citus_schema_designer
      - name: Run canonical schema-designer report
        run: cargo run -q -p ai_blaise_citus_schema_designer -- run-canonical

  tui:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Format
        run: cargo fmt --all -- --check
      - name: Check tests
        run: cargo check -p ai_blaise_citus_tui --all-targets
      - name: Test
        run: cargo test -p ai_blaise_citus_tui
      - name: Run canonical TUI report
        run: cargo run -q -p ai_blaise_citus_tui -- run-canonical

  admin:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Format
        run: cargo fmt --all -- --check
      - name: Check tests
        run: cargo check -p ai_blaise_citus_admin --all-targets
      - name: Test
        run: cargo test -p ai_blaise_citus_admin
      - name: Run canonical admin report
        run: cargo run -q -p ai_blaise_citus_admin -- run-canonical
