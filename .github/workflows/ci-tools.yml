name: tools

on:
  pull_request:
  push:
    branches:
      - main
      - ai-blaise/dev

jobs:
  mcp:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - name: Format
        run: cargo fmt --all -- --check
      - name: Clippy ai_blaise_citus_mcp (warnings denied)
        run: cargo clippy -p ai_blaise_citus_mcp --all-targets -- -D warnings
      - name: Rustdoc broken-intra-doc-links ai_blaise_citus_mcp
        run: RUSTDOCFLAGS="-D rustdoc::broken-intra-doc-links" cargo doc -p ai_blaise_citus_mcp --no-deps
      - name: Check tests
        run: cargo check -p ai_blaise_citus_mcp --all-targets
      - name: Test
        run: cargo test -p ai_blaise_citus_mcp
      - name: Run canonical MCP tool report
        run: cargo run -q -p ai_blaise_citus_mcp -- run-canonical
      - name: Run MCP stdio smoke
        run: bash ci/ai-blaise/mcp-stdio-smoke.sh
      - name: Run MCP database smoke
        run: REQUIRE_DOCKER=1 bash ci/ai-blaise/mcp-db-smoke.sh

  citusctl:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - name: Format
        run: cargo fmt --all -- --check
      - name: Check tests
        run: cargo check -p ai_blaise_citusctl --tests
      - name: Test
        run: cargo test -p ai_blaise_citusctl
      - name: Run canonical citusctl report
        run: cargo run -q -p ai_blaise_citusctl -- run-canonical
      - name: Run citusctl plan-id smoke
        run: bash ci/ai-blaise/citusctl-smoke.sh
      - name: Run citusctl dev lifecycle smoke
        run: bash ci/ai-blaise/citusctl-dev-lifecycle-smoke.sh

  lsp:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - name: Format
        run: cargo fmt --all -- --check
      - name: Clippy ai_blaise_citus_lsp (warnings denied)
        run: cargo clippy -p ai_blaise_citus_lsp --all-targets -- -D warnings
      - name: Rustdoc broken-intra-doc-links ai_blaise_citus_lsp
        run: RUSTDOCFLAGS="-D rustdoc::broken-intra-doc-links" cargo doc -p ai_blaise_citus_lsp --no-deps
      - name: Check tests
        run: cargo check -p ai_blaise_citus_lsp --all-targets
      - name: Test
        run: cargo test -p ai_blaise_citus_lsp
      - name: Run file-backed LSP smoke
        run: bash ci/ai-blaise/citus-lsp-smoke.sh

  ui-runtime:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - name: Format
        run: cargo fmt --all -- --check
      - name: Check tests
        run: >-
          cargo check --all-targets
          -p ai_blaise_citus_tool_runtime
          -p ai_blaise_citus_admin
          -p ai_blaise_citus_schema_designer
          -p ai_blaise_citus_tui
          -p ai_blaise_citus_watch
      - name: Test
        run: cargo test -p ai_blaise_citus_tool_runtime -p ai_blaise_citus_admin -p ai_blaise_citus_schema_designer -p ai_blaise_citus_tui -p ai_blaise_citus_watch
      - name: Run tools UI runtime smoke
        run: bash ci/ai-blaise/tools-ui-runtime-smoke.sh

  watch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - name: Format
        run: cargo fmt --all -- --check
      - name: Clippy ai_blaise_citus_watch (warnings denied)
        run: cargo clippy -p ai_blaise_citus_watch --all-targets -- -D warnings
      - name: Rustdoc broken-intra-doc-links ai_blaise_citus_watch
        run: RUSTDOCFLAGS="-D rustdoc::broken-intra-doc-links" cargo doc -p ai_blaise_citus_watch --no-deps
      - name: Check tests
        run: cargo check -p ai_blaise_citus_watch --all-targets
      - name: Test
        run: cargo test -p ai_blaise_citus_watch
      - name: Run canonical watch dashboard report
        run: cargo run -q -p ai_blaise_citus_watch -- run-canonical

  schema-designer:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
