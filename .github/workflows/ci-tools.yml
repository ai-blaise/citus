        run: cargo fmt --all -- --check
      - name: Clippy ai_blaise_citus_schema_designer (warnings denied)
        run: cargo clippy -p ai_blaise_citus_schema_designer --all-targets -- -D warnings
      - name: Rustdoc broken-intra-doc-links ai_blaise_citus_schema_designer
        run: RUSTDOCFLAGS="-D rustdoc::broken-intra-doc-links" cargo doc -p ai_blaise_citus_schema_designer --no-deps
      - name: Check tests
        run: cargo check -p ai_blaise_citus_schema_designer --all-targets
      - name: Test
        run: cargo test -p ai_blaise_citus_schema_designer
      - name: Run canonical schema-designer report
        run: cargo run -q -p ai_blaise_citus_schema_designer -- run-canonical

  tui:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - name: Format
        run: cargo fmt --all -- --check
      - name: Clippy ai_blaise_citus_tui (warnings denied)
        run: cargo clippy -p ai_blaise_citus_tui --all-targets -- -D warnings
      - name: Rustdoc broken-intra-doc-links ai_blaise_citus_tui
        run: RUSTDOCFLAGS="-D rustdoc::broken-intra-doc-links" cargo doc -p ai_blaise_citus_tui --no-deps
      - name: Check tests
        run: cargo check -p ai_blaise_citus_tui --all-targets
      - name: Test
        run: cargo test -p ai_blaise_citus_tui
      - name: Run canonical TUI report
        run: cargo run -q -p ai_blaise_citus_tui -- run-canonical

  admin:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - name: Format
        run: cargo fmt --all -- --check
      - name: Clippy ai_blaise_citus_admin (warnings denied)
        run: cargo clippy -p ai_blaise_citus_admin --all-targets -- -D warnings
      - name: Rustdoc broken-intra-doc-links ai_blaise_citus_admin
        run: RUSTDOCFLAGS="-D rustdoc::broken-intra-doc-links" cargo doc -p ai_blaise_citus_admin --no-deps
      - name: Check tests
        run: cargo check -p ai_blaise_citus_admin --all-targets
      - name: Test
        run: cargo test -p ai_blaise_citus_admin
      - name: Run canonical admin report
        run: cargo run -q -p ai_blaise_citus_admin -- run-canonical
