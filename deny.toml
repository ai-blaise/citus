# cargo-deny configuration for ai-blaise/citus.
#
# Run: cargo deny check
# CI: .github/workflows/ci-rust-quality.yml gates this on every PR.
#
# License policy mirrors ci/ai-blaise/license-check.sh and
# docs/ai-blaise/LICENSE_AUDIT.md: the workspace itself is AGPL-3.0-or-later
# and transitive deps must stay permissive. GPL-2.0/GPL-3.0/LGPL-2.1/LGPL-3.0
# are forbidden because they would virally contaminate the distribution
# surface. The license-check.sh SPDX scanner enforces the same rule on
# every PR.

[graph]
all-features = true

[licenses]
allow = [
  "MIT",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "ISC",
  "Zlib",
  "Unicode-3.0",
  "AGPL-3.0-or-later",
  "BSL-1.0",
  "Unlicense",
]
confidence-threshold = 0.93

[bans]
multiple-versions = "allow"
wildcards = "warn"

[advisories]
yanked = "warn"
# RUSTSEC-2021-0127: serde_cbor 0.11.2 is unmaintained. Pulled in transitively
# by pgrx 0.18 (the Postgres extension framework). We cannot drop pgrx and the
# crate is not currently exploitable; we accept the unmaintained status until
# pgrx upstream removes the dep. Re-evaluate on every pgrx bump.
ignore = ["RUSTSEC-2021-0127"]

[sources]
unknown-registry = "warn"
unknown-git = "warn"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
