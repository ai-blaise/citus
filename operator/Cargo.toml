[package]
name = "ai_blaise_citus_operator"
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
ai_blaise_citus_companion = { path = "../companion" }
ai_blaise_citus_sidecar_shared = { path = "../sidecar/shared" }
tokio = { version = "1.41", features = ["rt-multi-thread", "macros", "signal", "sync", "time", "net", "io-util"] }
tokio-rustls = { version = "0.26.4", default-features = false, features = ["ring", "tls12"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
async-trait = "0.1"
thiserror = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio-postgres = "0.7"
serde_yaml = "0.9"
schemars = "1.2"
kube = { version = "4.2", default-features = false, features = ["runtime", "client", "rustls-tls", "ring", "derive"] }
kube-runtime = { version = "4.2", default-features = false }
k8s-openapi = { version = "0.28", default-features = false, features = ["std", "v1_35", "schemars"] }
futures = "0.3"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }
sha2 = "0.10"
x509-parser = { version = "0.16", features = ["verify"] }
