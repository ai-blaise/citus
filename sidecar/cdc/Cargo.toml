[package]
name = "ai_blaise_citus_sidecar_cdc"
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
ai_blaise_citus_sidecar_shared = { path = "../shared" }
serde_json = "1"
tokio = { version = "1.41", features = ["rt-multi-thread", "macros", "signal", "sync", "time", "net", "io-util"] }
tokio-postgres = { version = "0.7", features = ["runtime"] }
async-nats = "0.40"
axum = { version = "0.7", default-features = false, features = ["http1", "tokio"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
futures-util = "0.3"
bytes = "1"
thiserror = "1"
async-trait = "0.1"

[dev-dependencies]
# The full Postgres+NATS spin lives in the bootstrap-v2 cluster e2e harness;
# the ignored cdc_replay test compiles against the regular runtime surface.
