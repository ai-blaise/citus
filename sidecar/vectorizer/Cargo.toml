[package]
name = "ai_blaise_citus_sidecar_vectorizer"
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
ai_blaise_citus_sidecar_shared = { path = "../shared" }
async-trait = "0.1"
axum = { version = "0.7", default-features = false, features = ["json", "tokio", "http1", "matched-path", "query"] }
governor = { version = "0.7", default-features = false, features = ["std", "jitter", "quanta"] }
moka = { version = "0.12", features = ["future"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json", "gzip"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "sync", "signal", "time", "net", "io-util"] }
tokio-postgres = "0.7"
tower = { version = "0.5", default-features = false }
tracing = "0.1"
tracing-subscriber = { version = "0.3", default-features = false, features = ["fmt", "env-filter"] }

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread", "test-util", "time", "process"] }
