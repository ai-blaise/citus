# FEATURE: Bundle1
# Load-order-sensitive shared library contract for ai-blaise/citus.
#
# All entries are present in the bundle1-final-light / bundle1-final-full
# operand image and required for the corresponding extension to function at
# startup. Optional or alpha extensions (plrust, pg_hint_plan, sr_plan, etc.)
# are deliberately excluded so the production initdb path never references
# uninstalled libraries.
# Trusted Bundle1 coextensions install their hooks before Citus. The fork's
# explicit cohabitation policy permits this ordering; plain upstream deployments
# that do not opt into that policy retain Citus's normal first-load rule.
shared_preload_libraries = 'timescaledb,pgaudit,pgauditlogtofile,pgsodium,pg_cron,age,pg_failover_slots,pgnodemx,citus'
citus.cohabit_extensions = 'timescaledb,pg_cron'
